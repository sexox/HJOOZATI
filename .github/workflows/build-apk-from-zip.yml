name: HJOOZATI - Build APK from ZIP

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP and Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP archive
        id: archive
        shell: bash
        run: |
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 -type f -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP_FILE"

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -o "${{ steps.archive.outputs.zip_file }}" \
            -d extracted

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          PROJECT_FILE=$(find extracted \
            -type f -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find extracted \
              -type f -name "settings.gradle" \
              | head -n 1)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Android app module not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HJOOZATI-Android-APK
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
